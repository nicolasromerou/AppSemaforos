name: control_semaforos
description: Monitoreo e incidencias del cruce de la maqueta 3D.
publish_to: none
version: 0.1.0+6

environment:
  sdk: ^3.10.0-290.4.beta

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  image_picker: ^1.2.2
  intl: ^0.20.2
  supabase_flutter: ^2.18.3
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/cruce-symbol.png
    - assets/config/supabase.json
    - assets/fonts/Manrope-OFL.txt
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
